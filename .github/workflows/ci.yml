name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true

      - name: Run build
        run: pnpm build

  linting:
    name: Linting
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true

      - name: Run pnpm lint:eslint
        if: ${{ success() || failure() }}
        run: pnpm lint:eslint

      - name: Run pnpm lint:markdownlint
        if: ${{ success() || failure() }}
        run: pnpm lint:markdownlint

      - name: Run pnpm lint:prettier
        if: ${{ success() || failure() }}
        run: pnpm lint:prettier

      - name: Run pnpm lint:tsc
        if: ${{ success() || failure() }}
        run: pnpm lint:tsc

  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-26.04, windows-2025]
        node: ["22.12.0", "24", "26"]
        include:
          - os: ubuntu-26.04
            node: "24"
            extra: coverage

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          runtime: node@${{ matrix.node }}

      - name: Run build
        run: pnpm build

      # Everything run through pnpm uses the Node.js version from devEngines.runtime,
      # so the tests below call Vitest directly to run on the version from the matrix.
      - name: Print Node.js version used by the tests
        run: node --version

      - name: "Prettier v1: Run tests"
        if: ${{ success() || failure() }}
        run: node node_modules/vitest/vitest.mjs --run
        env:
          COVERAGE: ${{ matrix.extra == 'coverage' }}
          PRETTIER_MAJOR_VERSION: "1"

      - name: "Prettier v1: Report coverage to codecov.io"
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.extra == 'coverage'
        with:
          name: prettier-v1
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: "Prettier v2: Run tests"
        if: ${{ success() || failure() }}
        run: node node_modules/vitest/vitest.mjs --run
        env:
          COVERAGE: ${{ matrix.extra == 'coverage' }}
          PRETTIER_MAJOR_VERSION: "2"

      - name: "Prettier v2: Report coverage to codecov.io"
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.extra == 'coverage'
        with:
          name: prettier-v2
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: "Prettier v3: Run tests"
        if: ${{ success() || failure() }}
        run: node node_modules/vitest/vitest.mjs --run
        env:
          COVERAGE: ${{ matrix.extra == 'coverage' }}

      - name: "Prettier v3: Report coverage to codecov.io"
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.extra == 'coverage'
        with:
          name: prettier-v3
          token: ${{ secrets.CODECOV_TOKEN }}
