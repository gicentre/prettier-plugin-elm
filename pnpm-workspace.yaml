allowBuilds:
  elm-format: true # Downloads the elm-format binary.
  esbuild: true # Optimizes binaries to improve performance - https://github.com/evanw/esbuild/issues/4085#issuecomment-2696009329
  unrs-resolver: false # The prebuilt binary comes via optional dependencies, so the fallback script is not needed.
# Collapse compatible duplicate versions whenever pnpm writes the lockfile, so every install keeps it
# as lean as `pnpm dedupe` would. This replaces the `pnpm dedupe --check` CI step: the two algorithms
# can break ties differently, so the check could fail a lockfile a plain `pnpm install` just wrote.
autoDedupe: true
nodeLinker: isolated
